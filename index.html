<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добро пожаловать</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f9f1ff 50%, #e8fbff);
      color: #1f2937;
    }

    .card {
      width: min(720px, 100%);
      overflow: hidden;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(31, 41, 55, 0.14);
    }

    .card img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .content {
      padding: 34px 28px 40px;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.03em;
    }

    p {
      max-width: 46ch;
      margin: 0 auto 26px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #4b5563;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <main class="card">
    <img
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
      alt="Красивый пейзаж"
    >

    <div class="content">
      <h1>Добро пожаловать!</h1>
      <p>
        Рад видеть вас на этой странице. Здесь всё просто:
        немного уюта, хорошего настроения и места для новых идей.
      </p>
      <a class="btn" href="#">Начать</a>
    </div>
  </main>

</body>
</html>
